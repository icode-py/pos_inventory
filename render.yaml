# Render Blueprint: creates the backend web service and its Postgres database together.
# Use: Render dashboard -> New -> Blueprint -> pick this repo. Render asks for the values marked
# `sync: false` once (they are secrets / per-deployment, so they are not stored in git).
#
# Check the plan names below against https://render.com/pricing when you create the blueprint;
# Render renames plans from time to time and will reject an unknown name.
# This does NOT touch an existing service: it creates new ones named below.

databases:
  - name: pos-db
    databaseName: posdb
    user: pos_user
    region: oregon
    plan: basic-256mb        # paid plan: free Postgres expires after 30 days
    postgresMajorVersion: "16"
    ipAllowList: []          # only services in this Render workspace/region can connect

services:
  - type: web
    name: pos-backend
    runtime: python
    region: oregon           # keep the same region as the database (internal URL needs it)
    plan: starter            # paid plan: free instances sleep after inactivity
    buildCommand: bash build.sh
    startCommand: gunicorn pos_inventory.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: pos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false          # e.g. pos-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # your frontend URL(s), e.g. https://pos-inventory-five.vercel.app
      - key: ADMIN_USERNAME
        sync: false          # first admin account, created by build.sh
      - key: ADMIN_PASSWORD
        sync: false
